# Quality gate on every PR/push; deploy to Cloudflare Workers after main is green.
# Deploy requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom@29 requires ^22.13 (not 22.12). Use npm 11 for package-lock peer resolution.
          node-version: "22.13"
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check, build, and test
        run: npm run check

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Run non-visual browser tests
        run: npm run test:e2e:ci

      - name: Upload production assets
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Serialize production deploys so migrations and Worker updates do not race.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Download production assets
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Apply remote D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Resolve the target through wrangler.jsonc so resource renames cannot drift from CI.
          command: d1 migrations apply DB --remote

      # Deploy fails with API 10085 when the bound bucket is missing. Recreate the
      # empty bucket declared in wrangler.jsonc; this does not restore deleted objects.
      - name: Ensure R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          info_log="$(mktemp)"
          if npx wrangler r2 bucket info ilist-r2 >"$info_log" 2>&1; then
            echo "R2 bucket ilist-r2 already exists"
            exit 0
          fi
          cat "$info_log"
          if grep -Eq "not found|10085|does not exist" "$info_log"; then
            echo "Creating missing R2 bucket ilist-r2"
            npx wrangler r2 bucket create ilist-r2
          else
            echo "Refusing to create ilist-r2 because the lookup failed for another reason"
            exit 1
          fi

      - name: Deploy Worker and Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify
